<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background-image:url('halofondo.jpeg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    transition:background-image .8s ease;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(2,6,23,0.76);
    z-index:-1;
}

.container{
    width:min(500px, 100%);
    padding:24px 18px;
}

.logo{
    text-align:center;
    font-size:48px;
    font-weight:900;
    margin-bottom:8px;
    color:#60a5fa;
    text-shadow:0 0 10px #2563eb, 0 0 30px #2563eb;
}

.subtitle{
    text-align:center;
    color:#e5e7eb;
    margin-bottom:22px;
    line-height:1.5;
}

.menu{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.menuBtn{
    background:#1e293b;
    color:white;
    border:1px solid rgba(255,255,255,.12);
    padding:12px 15px;
    border-radius:14px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
    transition:.25s;
}

.menuBtn:hover,
.menuBtn.active{
    background:#2563eb;
    transform:translateY(-2px);
}

.card{
    background:white;
    color:black;
    border-radius:28px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,0.5);
}

.loreImage{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:18px;
    margin-bottom:20px;
    background:#111827;
}

.universe{
    color:#2563eb;
    font-weight:bold;
    font-size:14px;
    text-transform:uppercase;
}

.title{
    font-size:32px;
    font-weight:bold;
    margin-top:8px;
    line-height:1.15;
}

.type{
    color:#6b7280;
    margin-top:7px;
}

.episodeMeta{
    display:none;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
    margin-top:18px;
}

.metaBox{
    background:#f1f5f9;
    border-radius:14px;
    padding:12px;
}

.metaLabel{
    display:block;
    color:#64748b;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:5px;
}

.metaValue{
    color:#0f172a;
    font-size:14px;
    font-weight:bold;
}

.section{
    margin-top:20px;
}

.section h3{
    margin-bottom:10px;
}

p{
    line-height:1.6;
}

.source{
    margin-top:18px;
    font-size:12px;
    color:#6b7280;
}

.source a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.mainBtn{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:16px;
    background:#2563eb;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.mainBtn:hover{
    background:#1d4ed8;
}

.backLink{
    display:block;
    width:max-content;
    margin:18px auto 0;
    color:#dbeafe;
    text-decoration:none;
    font-weight:bold;
}

.backLink:hover{
    color:white;
}

@media(max-width:520px){
    .logo{
        font-size:38px;
    }

    .title{

    }

</style>

function changeBackground(universe){
    if(universe === "Halo"){
        document.body.style.backgroundImage = "url('halofondo.jpeg')";
    }else if(universe === "Warhammer 40K"){
        document.body.style.backgroundImage = "url('warhammerfondo.jpg')";
    }else if(universe === "Star Wars"){
        document.body.style.backgroundImage = "url('starwarsfondo.jpg')";
    }else if(universe === "El Mentalista"){
        document.body.style.backgroundImage =
            "url('mentalista.jpg')";
    }else if(universe === "Dexter"){
        document.body.style.backgroundImage =
            "url('VIT5R8V-dexter-hd-wallpaper.jpg')";
    }
}

function setActiveButton(universe){
    document.querySelectorAll(".menuBtn").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.universe === universe
        );
    });
}

function cleanText(text){
    if(!text || text.trim() === ""){
        return "";
    }

    return text
        .replace(/\s+/g, " ")
        .replace(/\[[0-9]+\]/g, "")
        .trim();
}

function shortText(text, maxLength){
    if(!text || text.trim() === ""){
        return "";
    }

    if(text.length <= maxLength){
        return text;
    }

    return text.substring(0, maxLength) + "...";
}

function renderEpisodeMeta(item){
    const meta = document.getElementById("episodeMeta");

    if(item.episode){
        meta.style.display = "grid";
        document.getElementById("episode").innerText = item.episode;
        document.getElementById("airDate").innerText = item.airDate || "—";
    }else{
        meta.style.display = "none";
    }
}

function renderSource(item){
    const source = document.getElementById("source");

    if(item.source){
        source.innerHTML =
            'Fuente: <a href="' + item.source + '" target="_blank" rel="noopener noreferrer">' +
            (item.sourceLabel || item.universe + " Wiki") +
            '</a>';
    }else{
        source.innerText = "Información de episodios proporcionada por el usuario.";
    }
}

async function randomLore(){
    const filteredLore = lore.filter(
        item => item.universe === currentUniverse
    );

    let item;

    do{
        const random = Math.floor(Math.random() * filteredLore.length);
        item = filteredLore[random];
    }while(item.title === lastTitle && filteredLore.length > 1);

    lastTitle = item.title;

    document.getElementById("image").src = item.image;
    document.getElementById("image").alt = item.title;
    document.getElementById("universe").innerText = item.universe;
    document.getElementById("title").innerText = item.title;
    document.getElementById("type").innerText = item.type;
    document.getElementById("summary").innerText = "Cargando información...";
    document.getElementById("fact").innerText = "Preparando contenido...";
    document.getElementById("factTitle").innerText =
        (item.universe === "El Mentalista" || item.universe === "Dexter")
            ? "Dato destacado"
            : "Dato curioso";

    renderEpisodeMeta(item);
    renderSource(item);

    if(item.staticContent || !item.wiki){
        document.getElementById("summary").innerText = item.backupSummary;
        document.getElementById("fact").innerText = item.backupFact;
        return;
    }

    const url =
        item.wiki +
        "?origin=*" +
        "&action=query" +
        "&prop=extracts" +
        "&exintro=1" +
        "&explaintext=1" +
        "&format=json" +
        "&titles=" + encodeURIComponent(item.wikiTitle);

    try{
        const response = await fetch(url);

        if(!response.ok){
            throw new Error("Respuesta HTTP no válida: " + response.status);
        }

        const data = await response.json();
        const pageId = Object.keys(data.query.pages)[0];
        const page = data.query.pages[pageId];

        const resumenWiki = cleanText(page.extract);
        const resumenFinal = resumenWiki || item.backupSummary;

        document.getElementById("summary").innerText =
            shortText(resumenFinal, 650);

        document.getElementById("fact").innerText =
            item.backupFact;

    }catch(error){
        document.getElementById("summary").innerText =
            item.backupSummary;

        document.getElementById("fact").innerText =
            item.backupFact;

        console.log(error);
    }
}

function filterUniverse(universe){
    currentUniverse = universe;
    lastTitle = "";
    changeBackground(universe);
    setActiveButton(universe);
    randomLore();
}

document.getElementById("image").addEventListener("error", function(){
    if(!this.dataset.fallbackApplied){
        this.dataset.fallbackApplied = "true";
        this.src = "fondo_juegos.jpg";
    }
});

changeBackground(currentUniverse);
setActiveButton(currentUniverse);
randomLore();
</script>
